name: Validate infrastructure package

on:
  pull_request:
  push:
    branches:
      - main
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    name: Static and Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate package (Bash, JSON, YAML and policies)
        run: bash tools/validate-package.sh

      - name: Validate Docker Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' compose_file; do
            compose_dir="$(dirname "$compose_file")"
            env_file="$compose_dir/.env.example"
            echo "Validating $compose_file"
            if [[ -f "$env_file" ]]; then
              docker compose --env-file "$env_file" -f "$compose_file" config --quiet
            else
              docker compose -f "$compose_file" config --quiet
            fi
          done < <(find repos -type f \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) -print0)
