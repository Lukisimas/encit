server {
    listen 80;
    server_name xitle.encit.unam.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xitle.encit.unam.mx;

    # Certificado administrado por Certbot para xitle.encit.unam.mx.
    ssl_certificate     /etc/letsencrypt/live/xitle.encit.unam.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xitle.encit.unam.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/security/headers.conf;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $backend "http://revista-prod-web:80";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $backend;
    }
}
