server {
    listen 80;
    server_name cursos.dev.encit.unam.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cursos.dev.encit.unam.mx;

    ssl_certificate     /etc/nginx/certs/wildcard-dev.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/security/headers.conf;

    # Ajustar a las subredes internas reales. Este ejemplo sólo autoriza 10.10.10.0/24.
    allow 10.10.10.0/24;
    deny all;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $backend "http://cursos-dev-site:8080";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $backend;
    }
}
