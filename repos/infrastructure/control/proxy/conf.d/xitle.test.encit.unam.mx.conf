server {
    listen 80;
    server_name xitle.test.encit.unam.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xitle.test.encit.unam.mx;

    ssl_certificate     /etc/nginx/certs/wildcard-test.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard-test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/security/headers.conf;

    # Autorizar redes internas y VPN administrativa.
    allow 10.129.100.0/28;
    allow 10.10.10.0/24;
    deny all;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $backend "http://revista-test-web:80";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $backend;
    }
}
